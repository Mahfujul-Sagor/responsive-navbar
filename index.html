<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <ul class="sidebar">
      <li onclick=hidesidebar()><a href="#"><i class="fa-solid fa-xmark"></i></a></li>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <ul>
      <li><a href="#">Mahfujul Sagor</a></li>
      <li><a href="#" class="hideOnMobile">Home</a></li>
      <li><a href="#" class="hideOnMobile">About</a></li>
      <li><a href="#" class="hideOnMobile">Projects</a></li>
      <li><a href="#" class="hideOnMobile">Contact</a></li>
      <li class="menu-button" onclick=showsidebar()><a href="#"><i class="fa-solid fa-bars"></i></a></li>
    </ul>
  </nav>


  <script>
    function showsidebar(){
      const sidebar = document.querySelector('.sidebar')
      sidebar.style.display = 'flex'
    }
    function hidesidebar(){
      const sidebar = document.querySelector('.sidebar')
      sidebar.style.display = 'none'
    }
  </script>
</body>
</html>
